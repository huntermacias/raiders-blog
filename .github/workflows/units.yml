name: Refresh team grades

# How every team stacks up (/lab/teams), the matchup reports and the scouting numbers are built from nflverse's play-by-play, FTN
# charting, PFR advanced stats, snap counts and the games file. The weekly Lab job (lab-data.yml) rebuilds them on Monday and
# Tuesday along with the replays and clips, which is too slow for numbers that change every time a game's data lands.
#
# This rebuilds just those files, often. Each build downloads the files and takes about fifteen seconds. A file is written only when
# its numbers changed, so a run that finds nothing new makes no commit and no deploy. A game counts only once its plays are in
# nflverse (see build_units.py), so a run that catches the final score before the play-by-play changes nothing yet.
#
# The times are UTC. Sunday to Wednesday every two hours: Sunday's and Monday night's games, and the daily PFR and FTN refresh that
# lands in the morning. Thursday to Saturday three times a day, enough to catch Thursday night's game and Saturday's.
on:
  schedule:
    - cron: "35 */2 * * 0-3"
    - cron: "35 4,12,20 * * 4-6"
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with lab-data.yml, injuries.yml and rooting.yml, so two jobs never edit data/lab at the same time.
concurrency:
  group: lab-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEASON: ${{ vars.LAB_SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install pandas numpy pytest

      - name: Test the scripts
        run: python -m pytest scripts/lab/test_build_units.py scripts/lab/test_build_scouting.py scripts/lab/test_refresh_injuries.py -q

      - name: Build the position-group grades
        # Keeps each player's practice trail, and leaves the file alone when no finished game has its plays yet.
        run: python scripts/lab/build_units.py --season "$SEASON" --out data/lab/units.json

      - name: Build the scouting numbers
        run: python scripts/lab/build_scouting.py --season "$SEASON" --out data/lab/scouting.json

      - name: Commit if changed
        run: |
          git add data/lab/units.json data/lab/scouting.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh team grades and scouting"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
