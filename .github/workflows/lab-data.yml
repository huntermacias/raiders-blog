name: Refresh Lab data

# Pulls the latest nflverse play-by-play, rebuilds data/lab/season.json, and commits it
# only if a new game has finished. A commit to main triggers the normal Vercel deploy,
# where the data checks in tests/lib/lab.test.ts run before the site is built.
on:
  schedule:
    # Monday 10:00 UTC, after Sunday and Monday night games have been posted.
    - cron: "0 10 * * 1"
    # Tuesday too, in case the data was late.
    - cron: "0 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pandas pytest

      - name: Test the script
        run: python -m pytest scripts/lab -q

      - name: Build data
        run: python scripts/lab/build_lab_data.py --season ${{ vars.LAB_SEASON || '2026' }} --team LV --out data/lab/season.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/lab/season.json; then
            echo "No new games."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/season.json
          git commit -m "data: refresh Lab replays"
          git push
