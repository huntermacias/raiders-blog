name: Refresh Lab data

# Every Monday (and Tuesday, in case the data was late) this pulls the latest nflverse play-by-play and rebuilds
# everything the Lab shows: the game replays, the scouting numbers, the position-group matchups and the win-probability
# clips. It then adds the Lab's pieces to any postgame draft waiting in Studio. Everything is committed in one
# push, only if something changed; a commit to main triggers the normal Vercel deploy, where the data checks in
# tests/ run before the site is built.
on:
  schedule:
    # Monday 10:00 UTC, after Sunday and Monday night games have been posted.
    - cron: "0 10 * * 1"
    # Tuesday too, in case the data was late.
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      redraw_clips:
        description: "Redraw every clip, not just new or changed games"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lab-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEASON: ${{ vars.LAB_SEASON || '2026' }}
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install pandas numpy pytest

      - name: Test the scripts
        run: python -m pytest scripts/lab -q

      - name: Build game replays
        run: python scripts/lab/build_lab_data.py --season "$SEASON" --team LV --out data/lab/season.json

      - name: Build scouting numbers
        run: python scripts/lab/build_scouting.py --season "$SEASON" --out data/lab/scouting.json

      - name: Build position-group matchups
        # Grades, coaches, injuries and the coming slate for every team. Needs the coaches and spreads file as well.
        run: python scripts/lab/build_units.py --season "$SEASON" --out data/lab/units.json

      - name: Build the schedule for the Playoff Machine
        # Every game of the season with the results so far. Keeps the file as it is if the download looks wrong.
        run: python scripts/lab/build_schedule.py --season "$SEASON" --out data/lab/schedule.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install site packages
        run: |
          corepack enable
          yarn install --immutable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Draw clips
        run: |
          npx esbuild scripts/clips/render.tsx --bundle --platform=node --format=cjs --jsx=automatic --loader:.tsx=tsx --alias:@=. --external:@resvg/resvg-js --external:satori --log-level=warning --outfile=/tmp/render-clips.cjs
          if [ "${{ inputs.redraw_clips }}" = "true" ]; then FLAG="--all"; else FLAG=""; fi
          node /tmp/render-clips.cjs $FLAG

      - name: Add the Lab's pieces to postgame drafts
        # Skipped quietly when the secret is not set.
        if: ${{ env.SANITY_WRITE_TOKEN != '' }}
        run: |
          npx esbuild scripts/postgame/run.ts --bundle --platform=node --format=cjs --jsx=automatic --alias:@=. --log-level=warning --outfile=/tmp/postgame.cjs
          node /tmp/postgame.cjs enrich

      - name: Keep the clips for download
        uses: actions/upload-artifact@v4
        with:
          name: lab-clips
          path: public/lab/clips
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit if changed
        run: |
          git add -A data/lab public/lab/clips
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Lab replays, grades, scouting and clips"
          git push
